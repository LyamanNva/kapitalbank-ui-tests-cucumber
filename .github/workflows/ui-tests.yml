name: UI tests

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Cucumber tag expression
        required: false
        default: "not @known-bug"
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1-5" # weekdays 08:00 Baku time

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        run: >
          mvn -B test
          -Dheadless=false
          -Dcucumber.filter.tags="${{ github.event.inputs.tags || (github.event_name == 'schedule' && 'not @known-bug') || '@smoke' }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/cucumber-report.html
            target/cucumber.json
            target/allure-results
          if-no-files-found: warn
